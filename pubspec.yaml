name: newsreader
description: Reevo — centralize your RSS feeds and newsletters outside of email.
publish_to: 'none'

version: 1.8.0+9

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.0.0

  # Local database
  hive_ce: ^2.9.0
  hive_ce_flutter: ^2.2.0

  # Networking & Feeds
  http: ^1.2.0
  webfeed_plus: ^1.0.0
  html: ^0.15.6

  # UI
  cached_network_image: ^3.4.0
  flutter_widget_from_html: ^0.15.0
  webview_flutter: ^4.7.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0

  # Dependency injection
  get_it: ^8.0.0

  # Utils
  uuid: ^4.5.0
  intl: ^0.20.2

  # OPML Import
  file_picker: ^8.0.0
  xml: ^6.0.0

  # Data export
  share_plus: ^10.0.0

  # Auth
  supabase_flutter: ^2.8.0
  google_sign_in: ^6.2.0
  sign_in_with_apple: ^6.1.0

  # Suscripciones / paywall
  superwallkit_flutter: ^2.4.12

  # Observabilidad
  sentry_flutter: ^8.14.2
  posthog_flutter: ^5.38.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  hive_ce_generator: ^1.8.0
  build_runner: ^2.4.0
  flutter_launcher_icons: ^0.14.4
  sentry: ^8.14.2
  webview_flutter_platform_interface: ^2.14.0

flutter:
  uses-material-design: true
  generate: true
  # file_picker 8.3.7 declara mal su dependencia de Swift Package Manager
  # (pide la rama "4.3.9" de DKImagePickerController, que no existe como
  # rama, solo como tag), lo que rompe `flutter build ipa`. Se desactiva
  # SPM para este proyecto y se usa CocoaPods, que ya funciona bien.
  config:
    enable-swift-package-manager: false
  assets:
    - assets/reevo_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/reevo_logo.png
  min_sdk_android: 21
  remove_alpha_ios: true

dependency_overrides:
  # webfeed_plus ^1.1.2 restringe intl a ^0.19.0, pero flutter_localizations
  # (agregado para i18n) fija intl en 0.20.2 desde el SDK. webfeed_plus solo
  # usa DateFormat/date_symbol_data_local (lib/util/datetime.dart), una API
  # estable entre ambas versiones — se fuerza 0.20.2 acá.
  intl: ^0.20.2
